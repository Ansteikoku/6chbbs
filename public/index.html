<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>掲示板ホーム</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>
<body>

<div class="container">
    <h1>掲示板ホーム</h1>

    <!-- ナビゲーション -->
    <nav>
        <a href="index.html">ホーム</a> |
        <a href="terms.html">利用規約</a>
    </nav>

    <hr>

    <!-- 最近のスレッド -->
    <h2>最近のスレッド</h2>
    <div id="recentThreads">読み込み中…</div>

    <hr>

    <!-- 板一覧 -->
    <h2>板一覧</h2>
    <div id="boardList">読み込み中…</div>

    <hr>

    <!-- 利用規約 -->
    <h2>重要な情報</h2>
    <ul>
        <li><a href="terms.html">利用規約</a> - 掲示板利用前に必ずお読みください</li>
    </ul>
</div>

<script>
// 最近のスレッド一覧 + 最新レス
async function loadRecentThreads() {
    const box = document.getElementById("recentThreads");

    const { data: threads, error } = await sb
        .from("threads")
        .select("id,title,board_id,created_at")
        .order("id", { ascending: false })
        .limit(10);

    if (error) {
        box.innerHTML = "エラー：" + error.message;
        return;
    }
    if (!threads || threads.length === 0) {
        box.innerHTML = "最近のスレッドはありません。";
        return;
    }

    box.innerHTML = "";

    for (const t of threads) {
        const boardLink = `board.html?id=${t.board_id}`;
        const threadLink = `thread.html?id=${t.id}`;
        const date = new Date(t.created_at);
        const timeStr = date.toLocaleString();

        const { data: lastPost } = await sb
            .from("posts")
            .select("content")
            .eq("thread_id", t.id)
            .order("post_number", { ascending: false })
            .limit(1)
            .maybeSingle();

        const latestContent = lastPost ? lastPost.content : "(レスなし)";

        box.innerHTML += `
            <div class="recent-thread">
                <a href="${threadLink}" class="thread-link">${t.title}</a>
                <span class="thread-meta">[板: <a href="${boardLink}">リンク</a> | 作成: ${timeStr}]</span>
                <div class="latest-post-preview">${latestContent}</div>
            </div>
        `;
    }
}

// 板一覧読み込み
async function loadBoards() {
    const box = document.getElementById("boardList");
    const { data, error } = await sb.from("boards").select("*").order("id");
    if(error){ box.innerHTML="エラー："+error.message; return; }
    box.innerHTML="";
    data.forEach(board => {
        const url=`board.html?id=${board.id}`;
        box.innerHTML += `<a class="thread-link" href="${url}">${board.title}</a><br>`;
    });
}

// 初期ロード
loadRecentThreads();
loadBoards();
</script>

<style>
.recent-thread { margin-bottom: 15px; padding-bottom: 5px; border-bottom: 1px solid #ccc; }
.latest-post-preview { font-size: 0.9em; color: #555; margin-top: 3px; }
.thread-meta { font-size: 0.8em; color: #888; margin-left: 5px; }
</style>

</body>
</html>
